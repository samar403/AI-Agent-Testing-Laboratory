name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Dogfooding: the hardened simulated agent must clear the same gates we recommend to users.
  reliability-gate:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: AgentLab gate (support-v2)
        run: >
          npm run lab -- run examples/suites/support.yaml --agent sim:support-v2
          --trials 8 --seed 42 --min-ri 85 --min-pass 0.85 --junit agentlab-report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agentlab-report
          path: agentlab-report.xml
